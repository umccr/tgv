[package]
name = "tgv"
version = "0.0.4"
edition = "2024"
description = "Explore genomes in the terminal. Light, blazing fast 🚀, vim-motion."
license = "MIT"

[dependencies]
ratatui = "0.28.0"
crossterm = "0.28.1"
clap = { version = "4.4", features = ["derive"] }
sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
itertools="0.14.0"
url = "2.5.4"
csv = "1.3.1"
strum = {version = "0.27", features = ["derive"]}
serde_json = "1"
thiserror = {version = "2"}
async-trait = "0.1"
noodles = { version = "0.98", features = ["core", "async", "sam", "bam", "bgzf", "core", "cram", "csi", "htsget", "vcf"] }
opendal = { version = "0.53", features = ["services-s3", "services-gcs", "services-fs", "services-http"] }

[dev-dependencies]
rstest = "0.25.0"
shlex = "1.3.0"
insta = "1.42"
cargo-insta = "1.42"
